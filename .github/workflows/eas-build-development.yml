name: Build development app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger development app build
        env:
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_EXPO_OWNER: ${{ secrets.EXPO_PUBLIC_EXPO_OWNER }}
        run: >-
          eas build
          --platform ${{ inputs.platform }}
          --profile development
          --non-interactive
          --no-wait
